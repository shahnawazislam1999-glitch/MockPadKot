name: Build MockPad APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MockPad.apk
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MockPad-apk
          path: dist/MockPad.apk

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/MockPad.apk \
            --title "MockPad (latest build)" \
            --notes "Latest signed APK. Download MockPad.apk and install it on your phone." \
            --latest
